[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-live-captions"
version = "0.1.0"
description = "Privacy-first local live captions for Windows"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.1.1,<2",
  "numpy>=2,<3",
  "PyAudioWPatch>=0.2.12.7,<0.3",
]

[project.optional-dependencies]
gpu-windows = [
  "nvidia-cublas-cu12==12.9.2.10",
  "nvidia-cuda-nvrtc-cu12==12.9.86",
  "nvidia-cudnn-cu12==9.24.0.43",
]
packaging-windows = [
  "pyinstaller==6.22.2",
]

[project.scripts]
live-caption = "live_caption.cli:main"
caption-launcher = "live_caption.launcher:main"

[tool.setuptools.packages.find]
where = ["py"]
